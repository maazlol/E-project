<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Pc Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>

    <div id="navbar"></div>

    <div class="container py-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
                <li class="breadcrumb-item"><a href="products.html" class="text-decoration-none">Shop</a></li>
                <li class="breadcrumb-item active" aria-current="page">Product Detail</li>
            </ol>
        </nav>

        <div class="row g-5">
            <!-- Product Gallery -->
            <div class="col-lg-6">
                <div class="bg-white rounded-4 border p-4 mb-3 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?q=80&w=1200" class="img-fluid rounded" alt="Product Image">
                </div>
                <div class="row g-2">
                    <div class="col-3"><img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?q=80&w=300" class="img-fluid rounded border opacity-75 cursor-pointer"></div>
                    <div class="col-3"><img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=300" class="img-fluid rounded border opacity-75 cursor-pointer"></div>
                    <div class="col-3"><img src="https://images.unsplash.com/photo-1611186871348-b1ec696e52c9?q=80&w=300" class="img-fluid rounded border opacity-75 cursor-pointer"></div>
                    <div class="col-3"><img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?q=80&w=300" class="img-fluid rounded border opacity-75 cursor-pointer"></div>
                </div>
            </div>

            <!-- Product Info -->
            <div class="col-lg-6">
                <span class="badge bg-success bg-opacity-10 text-success mb-3">IN STOCK</span>
                <h1 class="fw-800 mb-3">Premium Workstation Pro</h1>
                <div class="d-flex align-items-center mb-4 text-warning gap-1">
                    <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-half"></i>
                    <span class="text-muted small ms-2">(12 reviews)</span>
                </div>
                <h2 class="text-primary fw-800 mb-4">$2,499.00</h2>
                <p class="text-muted mb-5 lead">The ultimate solution for professionals and enthusiasts. Experience unparalleled performance and sleek modern design.</p>
                
                <div class="d-flex gap-3">
                    <div style="width: 120px;">
                        <input type="number" class="form-control form-control-lg border-light" value="1" min="1">
                    </div>
                    <button class="btn btn-cyan btn-lg flex-grow-1 py-3 fw-bold shadow-sm"
                        data-add-to-cart
                        data-id="premium-work-pro"
                        data-name="Premium Workstation Pro"
                        data-price="$2,499.00"
                        data-image="https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?q=80&w=600">
                        ADD TO BAG
                    </button>
                </div>

                <div class="mt-5 pt-4 border-top">
                    <div class="row g-4">
                        <div class="col-6 d-flex align-items-center gap-3">
                            <i class="bi bi-truck text-primary fs-3"></i>
                            <div><span class="fw-bold d-block small">Free Delivery</span><span class="text-muted extra-small">On all orders over $500</span></div>
                        </div>
                        <div class="col-6 d-flex align-items-center gap-3">
                            <i class="bi bi-shield-check text-primary fs-3"></i>
                            <div><span class="fw-bold d-block small">2 Year Warranty</span><span class="text-muted extra-small">Official local support</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
