<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | Pc Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>

    <div id="navbar"></div>

    <div class="bg-white border-bottom py-5 mb-5 text-center">
        <div class="container">
            <h1 class="display-4 fw-800">Product <span class="text-gradient">Categories</span></h1>
            <p class="text-muted lead">Explore our curated selection of high-end hardware.</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4" id="categories-container">
            <!-- Categories will be loaded dynamically from categories-data.js -->
        </div>
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/data/categories-data.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('categories-container');
            if (container && typeof categoryData !== 'undefined') {
                container.innerHTML = categoryData.map(cat => `
                    <div class="col-md-6 col-lg-4">
                        <div class="category-card" onclick="location.href='${cat.link}'">
                            <img src="${cat.image}" alt="${cat.title}" onerror="this.src='https://placehold.co/600x400?text=${cat.title}'">
                            <div class="category-overlay p-4">
                                <h3 class="fw-bold mb-1 text-white">${cat.title}</h3>
                                <p class="small opacity-75 text-white">${cat.subtitle}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
