<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Checkout | Pc Center</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/cart.css" />
    <style>
        #order-success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .payment-locked {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-light">

    <div id="navbar"></div>

    <main class="checkout-container container" id="main-checkout">
        <div class="row g-4">

            <!-- Left Column -->
            <div class="col-lg-8">
                <div class="checkout-form-card">

                    <form id="checkout-form" class="needs-validation" novalidate>

                        <!-- Shipping -->
                        <section class="mb-5" id="shipping-section">
                            <h6 class="checkout-section-title">
                                <i class="bi bi-geo-alt"></i>
                                Shipping Information
                            </h6>

                            <div class="row g-3">

                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-muted">
                                        FULL NAME
                                    </label>

                                    <input
                                        type="text"
                                        id="chk-name"
                                        class="form-control form-control-lg bg-light border-0"
                                        placeholder="e.g. Noman"
                                        required
                                        minlength="3"
                                    />

                                    <div class="invalid-feedback">
                                        Please enter your full name.
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">
                                        PHONE NUMBER
                                    </label>

                                    <input
                                        type="tel"
                                        id="chk-phone"
                                        class="form-control form-control-lg bg-light border-0"
                                        placeholder="03xx-xxxxxxx"
                                        required
                                        pattern="^03\d{9}$"
                                    />

                                    <div class="invalid-feedback">
                                        Please enter valid phone number.
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">
                                        CITY
                                    </label>

                                    <input
                                        type="text"
                                        id="chk-city"
                                        class="form-control form-control-lg bg-light border-0"
                                        placeholder="Karachi"
                                        required
                                    />

                                    <div class="invalid-feedback">
                                        Please enter city.
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-muted">
                                        COMPLETE ADDRESS
                                    </label>

                                    <textarea
                                        id="chk-address"
                                        class="form-control form-control-lg bg-light border-0"
                                        rows="3"
                                        placeholder="House #, Street, Area..."
                                        required
                                        minlength="10"
                                    ></textarea>

                                    <div class="invalid-feedback">
                                        Please enter complete address.
                                    </div>
                                </div>

                            </div>
                        </section>

                        <!-- Payment -->
                        <section id="payment-section" class="payment-locked">

                            <h6 class="checkout-section-title">
                                <i class="bi bi-credit-card"></i>
                                Payment Method
                            </h6>

                            <div class="payment-method-selector">

                                <label class="payment-method-item active">
                                    <input type="radio" name="payment" value="COD" checked />

                                    <div class="ms-3">
                                        <div class="fw-bold">
                                            Cash on Delivery
                                        </div>

                                        <div class="small text-muted">
                                            Pay when your package arrives
                                        </div>
                                    </div>

                                    <i class="bi bi-cash-stack ms-auto fs-4 text-success"></i>
                                </label>

                                <label class="payment-method-item">
                                    <input type="radio" name="payment" value="Bank" />

                                    <div class="ms-3">
                                        <div class="fw-bold">
                                            Direct Bank Transfer
                                        </div>

                                        <div class="small text-muted">
                                            Transfer via mobile app or ATM
                                        </div>
                                    </div>

                                    <i class="bi bi-bank ms-auto fs-4 text-primary"></i>
                                </label>

                                <label class="payment-method-item">
                                    <input type="radio" name="payment" value="Mobile" />

                                    <div class="ms-3">
                                        <div class="fw-bold">
                                            EasyPaisa / JazzCash
                                        </div>

                                        <div class="small text-muted">
                                            Instant mobile wallet payment
                                        </div>
                                    </div>

                                    <i class="bi bi-phone-vibrate ms-auto fs-4 text-danger"></i>
                                </label>

                            </div>

                            <!-- Dynamic Payment -->
                            <div
                                id="payment-method-details"
                                class="mt-4 p-4 border rounded-3 bg-white shadow-sm"
                                style="display: none;"
                            ></div>

                        </section>

                        <button
                            type="submit"
                            class="btn btn-cyan btn-lg w-100 mt-5 py-3 fs-5 shadow"
                        >
                            Place My Order
                            <i class="bi bi-arrow-right ms-2"></i>
                        </button>

                    </form>

                </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-4">

                <div class="checkout-summary-card">

                    <h6 class="checkout-section-title">
                        Order Summary
                    </h6>

                    <div id="checkout-items-list"></div>

                    <div class="border-top pt-3 mt-3">

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span id="subtotal-amount" class="fw-bold">$0.00</span>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Shipping</span>
                            <span class="text-success fw-bold">FREE</span>
                        </div>

                        <div class="d-flex justify-content-between mt-3 pt-3 border-top">
                            <span class="h5 fw-bold mb-0">Total</span>
                            <span id="total-amount" class="h5 fw-bold text-primary mb-0">$0.00</span>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

    <!-- Success Overlay -->
    <div id="order-success-overlay">

        <div class="text-center px-4">

            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            </div>

            <h1 class="fw-bold mb-2">
                Order Confirmed!
            </h1>

            <p
                id="success-message"
                class="text-muted mb-3"
            >
                Your order has been placed successfully.
            </p>

            <button
                type="button"
                id="home-btn"
                class="btn btn-cyan px-5 py-2"
            >
                Back to Home
            </button>

        </div>

    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/components.js"></script>
    <script src="assets/data/products-data.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const listContainer = document.getElementById("checkout-items-list");
            const subtotalEl = document.getElementById("subtotal-amount");
            const totalEl = document.getElementById("total-amount");

            const form = document.getElementById("checkout-form");

            const paymentDetails = document.getElementById("payment-method-details");
            const paymentSection = document.getElementById("payment-section");

            const homeBtn = document.getElementById("home-btn");

            const successOverlay = document.getElementById("order-success-overlay");
            const mainCheckout = document.getElementById("main-checkout");

            const nameInput = document.getElementById("chk-name");
            const phoneInput = document.getElementById("chk-phone");
            const cityInput = document.getElementById("chk-city");
            const addressInput = document.getElementById("chk-address");

            function renderSummary() {

                const items = Cart.load();

                if (items.length === 0) {
                    window.location.href = "products.html";
                    return;
                }

                listContainer.innerHTML = items.map(item => `
                    <div class="summary-item-row align-items-start">

                        <img
                            src="${item.image}"
                            class="summary-item-img"
                            alt="${item.name}"
                        >

                        <div class="summary-item-info">

                            <p class="summary-item-name mb-1 fw-bold">
                                ${item.name}
                            </p>

                            <div class="small text-muted">
                                Qty: ${item.qty}
                            </div>

                        </div>

                        <div class="fw-bold">
                            $${(parseFloat(item.price.replace(/[$,]/g, "")) * item.qty).toFixed(2)}
                        </div>

                    </div>
                `).join("");

                const total = Cart.getTotal();

                subtotalEl.textContent = `$${total.toFixed(2)}`;
                totalEl.textContent = `$${total.toFixed(2)}`;
            }

            function updatePaymentFields(method) {

                paymentDetails.innerHTML = "";
                paymentDetails.style.display = "none";

                if (method === "Bank") {

                    paymentDetails.style.display = "block";

                    paymentDetails.innerHTML = `
                        <div class="mb-4 p-3 bg-primary-light rounded-3" style="background-color: rgba(13, 110, 253, 0.05);">
                            <h6 class="fw-bold mb-3"><i class="bi bi-info-circle-fill me-2"></i> Bank Account Details</h6>
                            <div class="row g-2 small">
                                <div class="col-4 text-muted">Bank Name:</div>
                                <div class="col-8 fw-bold">Meezan Bank Limited</div>
                                <div class="col-4 text-muted">Account Title:</div>
                                <div class="col-8 fw-bold">PC CENTER EXPORTS</div>
                                <div class="col-4 text-muted">Account #:</div>
                                <div class="col-8 fw-bold">1234-5678-9012-3456</div>
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase">Sender Account Title</label>
                                <input type="text" id="chk-bank-title" class="form-control bg-light border-0" placeholder="Name on your account" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase">Transaction ID / Ref #</label>
                                <input type="text" id="chk-bank-tid" class="form-control bg-light border-0" placeholder="e.g. 123456789" required>
                            </div>
                        </div>
                    `;
                }

                if (method === "Mobile") {

                    paymentDetails.style.display = "block";

                    paymentDetails.innerHTML = `
                        <div class="mb-4 p-3 bg-danger-light rounded-3" style="background-color: rgba(220, 53, 69, 0.05);">
                            <h6 class="fw-bold mb-3 text-danger"><i class="bi bi-phone-vibrate-fill me-2"></i> Mobile Wallet Details</h6>
                            <div class="row g-2 small">
                                <div class="col-5 text-muted">Wallet Name:</div>
                                <div class="col-7 fw-bold">EasyPaisa / JazzCash</div>
                                <div class="col-5 text-muted">Account Name:</div>
                                <div class="col-7 fw-bold">DANISH BHAI</div>
                                <div class="col-5 text-muted">Mobile #:</div>
                                <div class="col-7 fw-bold">0345-1234567</div>
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase">Your Mobile Number</label>
                                <input type="tel" id="chk-mobile-num" class="form-control bg-light border-0" placeholder="03xx-xxxxxxx" pattern="^03\\d{9}$" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted text-uppercase">Transaction ID</label>
                                <input type="text" id="chk-mobile-tid" class="form-control bg-light border-0" placeholder="TID from SMS" required>
                            </div>
                        </div>
                    `;
                }
            }

            function checkShippingComplete() {

                const isComplete =
                    nameInput.value.trim().length >= 3 &&
                    phoneInput.value.trim() !== "" &&
                    cityInput.value.trim() !== "" &&
                    addressInput.value.trim().length >= 10;

                if (isComplete) {
                    paymentSection.classList.remove("payment-locked");
                } else {
                    paymentSection.classList.add("payment-locked");
                }
            }

            [nameInput, phoneInput, cityInput, addressInput].forEach(input => {
                input.addEventListener("input", checkShippingComplete);
            });

            renderSummary();

            const paymentRadios = form.querySelectorAll('input[name="payment"]');

            paymentRadios.forEach(radio => {

                radio.addEventListener("change", (e) => {

                    document.querySelectorAll(".payment-method-item")
                        .forEach(item => item.classList.remove("active"));

                    e.target.closest(".payment-method-item")
                        .classList.add("active");

                    updatePaymentFields(e.target.value);

                });

            });

            form.addEventListener("submit", (e) => {

                e.preventDefault();

                if (!form.checkValidity()) {

                    e.stopPropagation();
                    form.classList.add("was-validated");

                    return;
                }

                mainCheckout.style.display = "none";
                successOverlay.style.display = "flex";

                Cart.clearCart();

            });

            homeBtn.addEventListener("click", () => {
                window.location.href = "index.html";
            });

        });
    </script>

</body>
</html>
