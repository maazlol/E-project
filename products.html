<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Pc Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>

    <div id="navbar"></div>

    <div class="bg-white border-bottom py-4 mb-5">
        <div class="container">
            <h1 class="fw-800 mb-0">Browse <span class="text-gradient">Products</span></h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Shop</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            <!-- Sidebar Filters -->
            <aside class="col-lg-3">
                <div class="filter-card">
                    <div class="mb-4">
                        <span class="filter-title">Filter by Category</span>
                        <div class="d-flex flex-column gap-2" id="category-filters">
                            <button class="btn btn-sm text-start category-filter active" data-category="All">All Categories</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Processors">Processors</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Laptops">Laptops</button>
                            <button class="btn btn-sm text-start category-filter" data-category="GPUs">GPUs</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Storage">Storage</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Monitors">Monitors</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Motherboards">Motherboards</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Memory">Memory</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Mouse and Keyboard">Mouse and Keyboard</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Printers">Printers</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Scanners">Scanners</button>
                            <button class="btn btn-sm text-start category-filter" data-category="UPS">UPS</button>
                            <button class="btn btn-sm text-start category-filter" data-category="Modems">Modems</button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <span class="filter-title">Price Range: <span id="price-value" class="text-primary fw-bold">$5,000</span></span>
                        <input type="range" class="form-range" min="0" max="5000" id="priceRange" value="5000">
                        <div class="d-flex justify-content-between small text-muted">
                            <span>$0</span>
                            <span>$5,000</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <span class="filter-title">SEARCH</span>
                        <div class="input-group search-wrapper">
                            <input type="text" id="product-search" class="form-control bg-light border-0" placeholder="Model name...">
                            <button class="btn btn-light" id="search-btn"><i class="bi bi-search"></i></button>
                        </div>
                    </div>

                    <button class="btn btn-cyan w-100 shadow-sm" id="apply-filters-btn">Apply Filters</button>
                </div>
            </aside>

            <!-- Product Grid -->
            <main class="col-lg-9">
                <div id="active-filters-container" class="mb-3 d-flex flex-wrap gap-2"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <p class="mb-0 text-muted" id="product-count">Showing 0 products</p>
                    <div class="d-flex align-items-center">
                        <label class="me-2 small fw-bold text-muted">SORT BY:</label>
                        <select class="form-select form-select-sm border-0 bg-light fw-bold" id="sort-select">
                            <option value="newest">Newest Arrivals</option>
                            <option value="low">Price: Low to High</option>
                            <option value="high">Price: High to Low</option>
                        </select>
                    </div>
                </div>

                <div class="row g-4" id="product-container">
                    <!-- Products will be rendered here by JS -->
                </div>
            </main>
        </div>
    </div>

    <div id="footer"></div>

    <!-- Essential Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/data/products-data.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
