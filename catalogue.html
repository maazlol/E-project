<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Catalogue | PC Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cart.css">
    <link rel="stylesheet" href="assets/css/catalogue.css">
</head>
<body>

    <div id="navbar"></div>

    <!-- ── Page Header ── -->
    <header class="catalogue-header">
        <div class="container">
            <h1>Brand <span class="header-accent">Catalogue</span></h1>
            <p>Browse our full range of products from world-leading tech brands.</p>
            <div id="catalogue-stats"></div>
        </div>
    </header>

    <!-- ── Brand Quick-Access Chips ── -->
    <div class="brand-grid-section">
        <div class="container">
            <p class="brand-grid-label">Jump to brand</p>
            <div class="row g-3" id="brand-grid">
                <!-- Chips rendered by catalogue.js -->
            </div>
        </div>
    </div>

    <!-- ── Product Sections ── -->
    <main class="container mb-5 pb-5" id="catalogue-sections">
        <!-- Dynamic sections rendered by catalogue.js -->
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/data/catalogue-data.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/catalogue.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
